name: Sync Solutions to DSA-Vault

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      sync_all:
        description: 'Force full sync of all solutions'
        required: false
        default: false
        type: boolean

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Sync Script
        env:
          SYNC_URL: ${{ secrets.SYNC_URL }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
          GITHUB_SHA: ${{ github.sha }}
          SYNC_ALL: ${{ inputs.sync_all }}
        run: python .github/scripts/sync.py
